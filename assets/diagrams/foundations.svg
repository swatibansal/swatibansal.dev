<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 505" role="img" aria-labelledby="title desc"><title id="title">Four experiments, four questions</title><desc id="desc">Controlled experiments isolate nonlinearity, depth, embeddings, and generalization. Each compares model behavior against an explicit alternative or held-out evidence.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7de1dc"/></marker></defs><rect width="660" height="505" rx="12" fill="#0c1524"/><path d="M 330.0 120 V 157.5 H 160.0 V 195" fill="none" stroke="#7de1dc" stroke-width="2" marker-end="url(#arrow)"/><text x="245.0" y="147.5" text-anchor="middle" fill="#b6a0f4" font-family="Arial,sans-serif" font-size="12">expressiveness</text><path d="M 330.0 120 V 157.5 H 500.0 V 195" fill="none" stroke="#7de1dc" stroke-width="2" marker-end="url(#arrow)"/><text x="415.0" y="147.5" text-anchor="middle" fill="#b6a0f4" font-family="Arial,sans-serif" font-size="12">composition</text><path d="M 330.0 120 V 345 H 160.0 V 370" fill="none" stroke="#7de1dc" stroke-width="2" marker-end="url(#arrow)"/><path d="M 330.0 120 V 345 H 500.0 V 370" fill="none" stroke="#7de1dc" stroke-width="2" marker-end="url(#arrow)"/><rect x="190" y="30" width="280" height="90" rx="9" fill="#17263a" stroke="#405b70"/><text x="330.0" y="62" text-anchor="middle" fill="#7de1dc" font-family="Arial,sans-serif" font-size="18" font-weight="600">Change one idea at a time</text><text x="330.0" y="86" text-anchor="middle" fill="#bbc7d7" font-family="Arial,sans-serif" font-size="14" font-weight="400">Inspect evidence, not intuition</text><rect x="20" y="195" width="280" height="90" rx="9" fill="#17263a" stroke="#405b70"/><text x="160.0" y="227" text-anchor="middle" fill="#7de1dc" font-family="Arial,sans-serif" font-size="18" font-weight="600">Nonlinearity</text><text x="160.0" y="251" text-anchor="middle" fill="#bbc7d7" font-family="Arial,sans-serif" font-size="14" font-weight="400">Linear vs ReLU on rings</text><rect x="360" y="195" width="280" height="90" rx="9" fill="#17263a" stroke="#405b70"/><text x="500.0" y="227" text-anchor="middle" fill="#7de1dc" font-family="Arial,sans-serif" font-size="18" font-weight="600">Depth</text><text x="500.0" y="251" text-anchor="middle" fill="#bbc7d7" font-family="Arial,sans-serif" font-size="14" font-weight="400">One vs stacked linear layers</text><rect x="20" y="370" width="280" height="90" rx="9" fill="#17263a" stroke="#405b70"/><text x="160.0" y="402" text-anchor="middle" fill="#7de1dc" font-family="Arial,sans-serif" font-size="18" font-weight="600">Embeddings</text><text x="160.0" y="426" text-anchor="middle" fill="#bbc7d7" font-family="Arial,sans-serif" font-size="14" font-weight="400">Inspect learned neighborhoods</text><rect x="360" y="370" width="280" height="90" rx="9" fill="#17263a" stroke="#405b70"/><text x="500.0" y="402" text-anchor="middle" fill="#7de1dc" font-family="Arial,sans-serif" font-size="18" font-weight="600">Generalization</text><text x="500.0" y="426" text-anchor="middle" fill="#bbc7d7" font-family="Arial,sans-serif" font-size="14" font-weight="400">Training vs held-out accuracy</text></svg>