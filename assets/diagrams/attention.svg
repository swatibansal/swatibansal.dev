<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 480" role="img" aria-labelledby="title desc"><title id="title">Choose by the bottleneck</title><desc id="desc">Attention techniques address different constraints: pairwise work, memory traffic, inference state, or position representation. They are not interchangeable optimizations.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7de1dc"/></marker></defs><rect width="660" height="480" rx="12" fill="#0c1524"/><path d="M 330.0 120 V 152.5 H 160.0 V 185" fill="none" stroke="#7de1dc" stroke-width="2" marker-end="url(#arrow)"/><text x="245.0" y="142.5" text-anchor="middle" fill="#b6a0f4" font-family="Arial,sans-serif" font-size="12">compute</text><path d="M 330.0 120 V 152.5 H 500.0 V 185" fill="none" stroke="#7de1dc" stroke-width="2" marker-end="url(#arrow)"/><text x="415.0" y="142.5" text-anchor="middle" fill="#b6a0f4" font-family="Arial,sans-serif" font-size="12">data movement</text><path d="M 330.0 120 V 330 H 160.0 V 355" fill="none" stroke="#7de1dc" stroke-width="2" marker-end="url(#arrow)"/><path d="M 330.0 120 V 330 H 500.0 V 355" fill="none" stroke="#7de1dc" stroke-width="2" marker-end="url(#arrow)"/><rect x="190" y="30" width="280" height="90" rx="9" fill="#17263a" stroke="#405b70"/><text x="330.0" y="62" text-anchor="middle" fill="#7de1dc" font-family="Arial,sans-serif" font-size="18" font-weight="600">Identify the constraint</text><text x="330.0" y="86" text-anchor="middle" fill="#bbc7d7" font-family="Arial,sans-serif" font-size="14" font-weight="400">What limits this workload?</text><rect x="20" y="185" width="280" height="90" rx="9" fill="#17263a" stroke="#405b70"/><text x="160.0" y="217" text-anchor="middle" fill="#7de1dc" font-family="Arial,sans-serif" font-size="18" font-weight="600">Pairwise work</text><text x="160.0" y="241" text-anchor="middle" fill="#bbc7d7" font-family="Arial,sans-serif" font-size="14" font-weight="400">Sparse / windowed attention</text><rect x="360" y="185" width="280" height="90" rx="9" fill="#17263a" stroke="#405b70"/><text x="500.0" y="217" text-anchor="middle" fill="#7de1dc" font-family="Arial,sans-serif" font-size="18" font-weight="600">Memory traffic</text><text x="500.0" y="241" text-anchor="middle" fill="#bbc7d7" font-family="Arial,sans-serif" font-size="14" font-weight="400">FlashAttention</text><rect x="20" y="355" width="280" height="90" rx="9" fill="#17263a" stroke="#405b70"/><text x="160.0" y="387" text-anchor="middle" fill="#7de1dc" font-family="Arial,sans-serif" font-size="18" font-weight="600">Inference state</text><text x="160.0" y="411" text-anchor="middle" fill="#bbc7d7" font-family="Arial,sans-serif" font-size="14" font-weight="400">MQA / GQA</text><rect x="360" y="355" width="280" height="90" rx="9" fill="#17263a" stroke="#405b70"/><text x="500.0" y="387" text-anchor="middle" fill="#7de1dc" font-family="Arial,sans-serif" font-size="18" font-weight="600">Position / context</text><text x="500.0" y="411" text-anchor="middle" fill="#bbc7d7" font-family="Arial,sans-serif" font-size="14" font-weight="400">Position and extension methods</text></svg>