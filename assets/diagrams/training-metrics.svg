<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 520" role="img" aria-labelledby="title desc"><title id="title">One token, one vote</title><desc id="desc">Unequal micro-batches require token-weighted aggregation. Compare correct and incorrect accumulation with the same seed and per-token metric to expose the error.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7de1dc"/></marker></defs><rect width="660" height="520" rx="12" fill="#0c1524"/><path d="M 330.0 120 V 157.5 H 160.0 V 195" fill="none" stroke="#7de1dc" stroke-width="2" marker-end="url(#arrow)"/><text x="245.0" y="147.5" text-anchor="middle" fill="#b6a0f4" font-family="Arial,sans-serif" font-size="12">correct weighting</text><path d="M 330.0 120 V 157.5 H 500.0 V 195" fill="none" stroke="#7de1dc" stroke-width="2" marker-end="url(#arrow)"/><text x="415.0" y="147.5" text-anchor="middle" fill="#b6a0f4" font-family="Arial,sans-serif" font-size="12">deliberate bug</text><path d="M 160.0 285 V 335.0 H 330.0 V 385" fill="none" stroke="#7de1dc" stroke-width="2" marker-end="url(#arrow)"/><text x="245.0" y="325.0" text-anchor="middle" fill="#b6a0f4" font-family="Arial,sans-serif" font-size="12">train</text><path d="M 500.0 285 V 335.0 H 330.0 V 385" fill="none" stroke="#7de1dc" stroke-width="2" marker-end="url(#arrow)"/><text x="415.0" y="325.0" text-anchor="middle" fill="#b6a0f4" font-family="Arial,sans-serif" font-size="12">train</text><rect x="190" y="30" width="280" height="90" rx="9" fill="#17263a" stroke="#405b70"/><text x="330.0" y="62" text-anchor="middle" fill="#7de1dc" font-family="Arial,sans-serif" font-size="18" font-weight="600">Unequal micro-batches</text><text x="330.0" y="86" text-anchor="middle" fill="#bbc7d7" font-family="Arial,sans-serif" font-size="14" font-weight="400">Different numbers of valid tokens</text><rect x="20" y="195" width="280" height="90" rx="9" fill="#17263a" stroke="#405b70"/><text x="160.0" y="227" text-anchor="middle" fill="#7de1dc" font-family="Arial,sans-serif" font-size="18" font-weight="600">Token-weighted sum</text><text x="160.0" y="251" text-anchor="middle" fill="#bbc7d7" font-family="Arial,sans-serif" font-size="14" font-weight="400">Divide by total valid tokens</text><rect x="360" y="195" width="280" height="90" rx="9" fill="#17263a" stroke="#405b70"/><text x="500.0" y="227" text-anchor="middle" fill="#7de1dc" font-family="Arial,sans-serif" font-size="18" font-weight="600">Average of averages</text><text x="500.0" y="251" text-anchor="middle" fill="#bbc7d7" font-family="Arial,sans-serif" font-size="14" font-weight="400">Each micro-batch gets equal weight</text><rect x="190" y="385" width="280" height="90" rx="9" fill="#17263a" stroke="#405b70"/><text x="330.0" y="417" text-anchor="middle" fill="#7de1dc" font-family="Arial,sans-serif" font-size="18" font-weight="600">Controlled comparison</text><text x="330.0" y="441" text-anchor="middle" fill="#bbc7d7" font-family="Arial,sans-serif" font-size="14" font-weight="400">Same seed + per-token metric</text></svg>