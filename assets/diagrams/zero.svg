<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 570" role="img" aria-labelledby="title desc"><title id="title">Shard more state, coordinate more work</title><desc id="desc">Data parallelism replicates model state. ZeRO-1 shards optimizer state; ZeRO-2 also shards gradients; ZeRO-3 also shards parameters. Temporary buffers still contribute to peak memory.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7de1dc"/></marker></defs><rect width="660" height="570" rx="12" fill="#0c1524"/><path d="M 300 80.0 H 360" fill="none" stroke="#7de1dc" stroke-width="2" marker-end="url(#arrow)"/><text x="330.0" y="66.0" text-anchor="middle" fill="#b6a0f4" font-family="Arial,sans-serif" font-size="12">shard O</text><path d="M 500.0 130 V 177.5 H 160.0 V 225" fill="none" stroke="#7de1dc" stroke-width="2" marker-end="url(#arrow)"/><text x="330.0" y="167.5" text-anchor="middle" fill="#b6a0f4" font-family="Arial,sans-serif" font-size="12">shard gradients</text><path d="M 300 275.0 H 360" fill="none" stroke="#7de1dc" stroke-width="2" marker-end="url(#arrow)"/><text x="330.0" y="261.0" text-anchor="middle" fill="#b6a0f4" font-family="Arial,sans-serif" font-size="12">shard P</text><path d="M 500.0 325 V 375.0 H 330.0 V 425" fill="none" stroke="#7de1dc" stroke-width="2" marker-end="url(#arrow)"/><text x="415.0" y="365.0" text-anchor="middle" fill="#b6a0f4" font-family="Arial,sans-serif" font-size="12">gather before use</text><rect x="20" y="30" width="280" height="100" rx="9" fill="#17263a" stroke="#405b70"/><text x="160.0" y="62" text-anchor="middle" fill="#7de1dc" font-family="Arial,sans-serif" font-size="18" font-weight="600">Data parallel</text><text x="160.0" y="86" text-anchor="middle" fill="#bbc7d7" font-family="Arial,sans-serif" font-size="14" font-weight="400">P: replicated · G: replicated</text><text x="160.0" y="110" text-anchor="middle" fill="#bbc7d7" font-family="Arial,sans-serif" font-size="14" font-weight="400">O: replicated</text><rect x="360" y="30" width="280" height="100" rx="9" fill="#17263a" stroke="#405b70"/><text x="500.0" y="62" text-anchor="middle" fill="#7de1dc" font-family="Arial,sans-serif" font-size="18" font-weight="600">ZeRO-1</text><text x="500.0" y="86" text-anchor="middle" fill="#bbc7d7" font-family="Arial,sans-serif" font-size="14" font-weight="400">P: replicated · G: replicated</text><text x="500.0" y="110" text-anchor="middle" fill="#bbc7d7" font-family="Arial,sans-serif" font-size="14" font-weight="400">O: sharded</text><rect x="20" y="225" width="280" height="100" rx="9" fill="#17263a" stroke="#405b70"/><text x="160.0" y="257" text-anchor="middle" fill="#7de1dc" font-family="Arial,sans-serif" font-size="18" font-weight="600">ZeRO-2</text><text x="160.0" y="281" text-anchor="middle" fill="#bbc7d7" font-family="Arial,sans-serif" font-size="14" font-weight="400">P: replicated · G: sharded</text><text x="160.0" y="305" text-anchor="middle" fill="#bbc7d7" font-family="Arial,sans-serif" font-size="14" font-weight="400">O: sharded</text><rect x="360" y="225" width="280" height="100" rx="9" fill="#17263a" stroke="#405b70"/><text x="500.0" y="257" text-anchor="middle" fill="#7de1dc" font-family="Arial,sans-serif" font-size="18" font-weight="600">ZeRO-3</text><text x="500.0" y="281" text-anchor="middle" fill="#bbc7d7" font-family="Arial,sans-serif" font-size="14" font-weight="400">P: sharded · G: sharded</text><text x="500.0" y="305" text-anchor="middle" fill="#bbc7d7" font-family="Arial,sans-serif" font-size="14" font-weight="400">O: sharded</text><rect x="190" y="425" width="280" height="100" rx="9" fill="#17263a" stroke="#405b70"/><text x="330.0" y="457" text-anchor="middle" fill="#7de1dc" font-family="Arial,sans-serif" font-size="18" font-weight="600">Capacity vs coordination</text><text x="330.0" y="481" text-anchor="middle" fill="#bbc7d7" font-family="Arial,sans-serif" font-size="14" font-weight="400">Count persistent + temporary state</text><text x="330" y="553" text-anchor="middle" fill="#a7b3c7" font-family="Arial,sans-serif" font-size="13">P = parameters · G = gradients · O = optimizer state</text></svg>