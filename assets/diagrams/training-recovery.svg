<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 515" role="img" aria-labelledby="title desc"><title id="title">Recover state and verify history</title><desc id="desc">Checkpoint model, optimizer, RNG, and loader state. After a crash restore the checkpoint, regenerate subsequent batches, compare ledger hashes, then continue.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7de1dc"/></marker></defs><rect width="660" height="515" rx="12" fill="#0c1524"/><path d="M 300 75.0 H 360" fill="none" stroke="#7de1dc" stroke-width="2" marker-end="url(#arrow)"/><text x="330.0" y="61.0" text-anchor="middle" fill="#b6a0f4" font-family="Arial,sans-serif" font-size="12">snapshot</text><path d="M 160.0 120 V 162.5 H 160.0 V 205" fill="none" stroke="#7de1dc" stroke-width="2" marker-end="url(#arrow)"/><text x="160.0" y="152.5" text-anchor="middle" fill="#b6a0f4" font-family="Arial,sans-serif" font-size="12">interruption</text><path d="M 300 250.0 H 360" fill="none" stroke="#7de1dc" stroke-width="2" marker-end="url(#arrow)"/><text x="330.0" y="236.0" text-anchor="middle" fill="#b6a0f4" font-family="Arial,sans-serif" font-size="12">resume</text><path d="M 500.0 120 V 162.5 H 500.0 V 205" fill="none" stroke="#7de1dc" stroke-width="2" marker-end="url(#arrow)"/><text x="500.0" y="152.5" text-anchor="middle" fill="#b6a0f4" font-family="Arial,sans-serif" font-size="12">saved state</text><path d="M 500.0 295 V 337.5 H 500.0 V 380" fill="none" stroke="#7de1dc" stroke-width="2" marker-end="url(#arrow)"/><text x="500.0" y="327.5" text-anchor="middle" fill="#b6a0f4" font-family="Arial,sans-serif" font-size="12">regenerate</text><path d="M 360 425.0 H 300" fill="none" stroke="#7de1dc" stroke-width="2" marker-end="url(#arrow)"/><text x="330.0" y="411.0" text-anchor="middle" fill="#b6a0f4" font-family="Arial,sans-serif" font-size="12">verified</text><rect x="20" y="30" width="280" height="90" rx="9" fill="#17263a" stroke="#405b70"/><text x="160.0" y="62" text-anchor="middle" fill="#7de1dc" font-family="Arial,sans-serif" font-size="18" font-weight="600">Train on admitted batches</text><text x="160.0" y="86" text-anchor="middle" fill="#bbc7d7" font-family="Arial,sans-serif" font-size="14" font-weight="400">Update model / append ledger</text><rect x="360" y="30" width="280" height="90" rx="9" fill="#17263a" stroke="#405b70"/><text x="500.0" y="62" text-anchor="middle" fill="#7de1dc" font-family="Arial,sans-serif" font-size="18" font-weight="600">Checkpoint</text><text x="500.0" y="86" text-anchor="middle" fill="#bbc7d7" font-family="Arial,sans-serif" font-size="14" font-weight="400">Model · optimizer · RNG · cursor</text><rect x="20" y="205" width="280" height="90" rx="9" fill="#17263a" stroke="#405b70"/><text x="160.0" y="237" text-anchor="middle" fill="#7de1dc" font-family="Arial,sans-serif" font-size="18" font-weight="600">Deliberate crash</text><text x="160.0" y="261" text-anchor="middle" fill="#bbc7d7" font-family="Arial,sans-serif" font-size="14" font-weight="400">Some progress after checkpoint</text><rect x="360" y="205" width="280" height="90" rx="9" fill="#17263a" stroke="#405b70"/><text x="500.0" y="237" text-anchor="middle" fill="#7de1dc" font-family="Arial,sans-serif" font-size="18" font-weight="600">Restore checkpoint</text><text x="500.0" y="261" text-anchor="middle" fill="#bbc7d7" font-family="Arial,sans-serif" font-size="14" font-weight="400">Recover execution state</text><rect x="360" y="380" width="280" height="90" rx="9" fill="#17263a" stroke="#405b70"/><text x="500.0" y="412" text-anchor="middle" fill="#7de1dc" font-family="Arial,sans-serif" font-size="18" font-weight="600">Replay + compare hashes</text><text x="500.0" y="436" text-anchor="middle" fill="#bbc7d7" font-family="Arial,sans-serif" font-size="14" font-weight="400">Verify against committed ledger</text><rect x="20" y="380" width="280" height="90" rx="9" fill="#17263a" stroke="#405b70"/><text x="160.0" y="412" text-anchor="middle" fill="#7de1dc" font-family="Arial,sans-serif" font-size="18" font-weight="600">Continue training</text><text x="160.0" y="436" text-anchor="middle" fill="#bbc7d7" font-family="Arial,sans-serif" font-size="14" font-weight="400">After replay verification</text></svg>