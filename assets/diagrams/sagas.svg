<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 485" role="img" aria-labelledby="title desc"><title id="title">Local commits, explicit recovery</title><desc id="desc">An illustrative choreographed workflow records durable intent and uses events between local transactions. Failures are retried when safe or compensated where the action is reversible.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7de1dc"/></marker></defs><rect width="660" height="485" rx="12" fill="#0c1524"/><path d="M 330.0 120 V 147.5 H 160.0 V 175" fill="none" stroke="#7de1dc" stroke-width="2" marker-end="url(#arrow)"/><text x="245.0" y="137.5" text-anchor="middle" fill="#b6a0f4" font-family="Arial,sans-serif" font-size="12">start</text><path d="M 300 220.0 H 360" fill="none" stroke="#7de1dc" stroke-width="2" marker-end="url(#arrow)"/><text x="330.0" y="206.0" text-anchor="middle" fill="#b6a0f4" font-family="Arial,sans-serif" font-size="12">event</text><path d="M 500.0 265 V 307.5 H 500.0 V 350" fill="none" stroke="#7de1dc" stroke-width="2" marker-end="url(#arrow)"/><text x="500.0" y="297.5" text-anchor="middle" fill="#b6a0f4" font-family="Arial,sans-serif" font-size="12">success</text><path d="M 500.0 265 V 307.5 H 160.0 V 350" fill="none" stroke="#7de1dc" stroke-width="2" marker-end="url(#arrow)"/><text x="330.0" y="297.5" text-anchor="middle" fill="#b6a0f4" font-family="Arial,sans-serif" font-size="12">failure</text><path d="M 20 395.0 H 8 V 220.0 H 20" fill="none" stroke="#7de1dc" stroke-width="2" marker-end="url(#arrow)"/><rect x="190" y="30" width="280" height="90" rx="9" fill="#17263a" stroke="#405b70"/><text x="330.0" y="62" text-anchor="middle" fill="#7de1dc" font-family="Arial,sans-serif" font-size="18" font-weight="600">Durable intent</text><text x="330.0" y="86" text-anchor="middle" fill="#bbc7d7" font-family="Arial,sans-serif" font-size="14" font-weight="400">Track workflow state</text><rect x="20" y="175" width="280" height="90" rx="9" fill="#17263a" stroke="#405b70"/><text x="160.0" y="207" text-anchor="middle" fill="#7de1dc" font-family="Arial,sans-serif" font-size="18" font-weight="600">Service A</text><text x="160.0" y="231" text-anchor="middle" fill="#bbc7d7" font-family="Arial,sans-serif" font-size="14" font-weight="400">Local transaction + event</text><rect x="360" y="175" width="280" height="90" rx="9" fill="#17263a" stroke="#405b70"/><text x="500.0" y="207" text-anchor="middle" fill="#7de1dc" font-family="Arial,sans-serif" font-size="18" font-weight="600">Service B</text><text x="500.0" y="231" text-anchor="middle" fill="#bbc7d7" font-family="Arial,sans-serif" font-size="14" font-weight="400">Idempotent event handling</text><rect x="360" y="350" width="280" height="90" rx="9" fill="#17263a" stroke="#405b70"/><text x="500.0" y="382" text-anchor="middle" fill="#7de1dc" font-family="Arial,sans-serif" font-size="18" font-weight="600">Advance / complete</text><text x="500.0" y="406" text-anchor="middle" fill="#bbc7d7" font-family="Arial,sans-serif" font-size="14" font-weight="400">Record successful progress</text><rect x="20" y="350" width="280" height="90" rx="9" fill="#17263a" stroke="#405b70"/><text x="160.0" y="382" text-anchor="middle" fill="#7de1dc" font-family="Arial,sans-serif" font-size="18" font-weight="600">Retry / compensate</text><text x="160.0" y="406" text-anchor="middle" fill="#bbc7d7" font-family="Arial,sans-serif" font-size="14" font-weight="400">Respect irreversible effects</text></svg>