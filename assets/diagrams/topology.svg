<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 470" role="img" aria-labelledby="title desc"><title id="title">From evidence to dependency graph</title><desc id="desc">Observed broker metadata and inferred repository configuration are combined into a typed graph with evidence labels, then used to explore ownership and dependencies.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7de1dc"/></marker></defs><rect width="660" height="470" rx="12" fill="#0c1524"/><path d="M 160.0 120 V 150.0 H 330.0 V 180" fill="none" stroke="#7de1dc" stroke-width="2" marker-end="url(#arrow)"/><text x="245.0" y="140.0" text-anchor="middle" fill="#b6a0f4" font-family="Arial,sans-serif" font-size="12">observed</text><path d="M 500.0 120 V 150.0 H 330.0 V 180" fill="none" stroke="#7de1dc" stroke-width="2" marker-end="url(#arrow)"/><text x="415.0" y="140.0" text-anchor="middle" fill="#b6a0f4" font-family="Arial,sans-serif" font-size="12">inferred</text><path d="M 330.0 270 V 310.0 H 160.0 V 350" fill="none" stroke="#7de1dc" stroke-width="2" marker-end="url(#arrow)"/><text x="245.0" y="300.0" text-anchor="middle" fill="#b6a0f4" font-family="Arial,sans-serif" font-size="12">ownership</text><path d="M 330.0 270 V 310.0 H 500.0 V 350" fill="none" stroke="#7de1dc" stroke-width="2" marker-end="url(#arrow)"/><text x="415.0" y="300.0" text-anchor="middle" fill="#b6a0f4" font-family="Arial,sans-serif" font-size="12">relationships</text><rect x="20" y="30" width="280" height="90" rx="9" fill="#17263a" stroke="#405b70"/><text x="160.0" y="62" text-anchor="middle" fill="#7de1dc" font-family="Arial,sans-serif" font-size="18" font-weight="600">Broker metadata</text><text x="160.0" y="86" text-anchor="middle" fill="#bbc7d7" font-family="Arial,sans-serif" font-size="14" font-weight="400">Observed topics and groups</text><rect x="360" y="30" width="280" height="90" rx="9" fill="#17263a" stroke="#405b70"/><text x="500.0" y="62" text-anchor="middle" fill="#7de1dc" font-family="Arial,sans-serif" font-size="18" font-weight="600">Repository config</text><text x="500.0" y="86" text-anchor="middle" fill="#bbc7d7" font-family="Arial,sans-serif" font-size="14" font-weight="400">Inferred application links</text><rect x="190" y="180" width="280" height="90" rx="9" fill="#17263a" stroke="#405b70"/><text x="330.0" y="212" text-anchor="middle" fill="#7de1dc" font-family="Arial,sans-serif" font-size="18" font-weight="600">Typed relationship graph</text><text x="330.0" y="236" text-anchor="middle" fill="#bbc7d7" font-family="Arial,sans-serif" font-size="14" font-weight="400">Keep evidence and uncertainty</text><rect x="20" y="350" width="280" height="90" rx="9" fill="#17263a" stroke="#405b70"/><text x="160.0" y="382" text-anchor="middle" fill="#7de1dc" font-family="Arial,sans-serif" font-size="18" font-weight="600">Ownership lookup</text><text x="160.0" y="406" text-anchor="middle" fill="#bbc7d7" font-family="Arial,sans-serif" font-size="14" font-weight="400">Who is responsible?</text><rect x="360" y="350" width="280" height="90" rx="9" fill="#17263a" stroke="#405b70"/><text x="500.0" y="382" text-anchor="middle" fill="#7de1dc" font-family="Arial,sans-serif" font-size="18" font-weight="600">Dependency exploration</text><text x="500.0" y="406" text-anchor="middle" fill="#bbc7d7" font-family="Arial,sans-serif" font-size="14" font-weight="400">What may be affected?</text></svg>