<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 555" role="img" aria-labelledby="title desc"><title id="title">A shared concurrency budget</title><desc id="desc">Consumers request permits from a shared pool. Saturated requests wait or retry; admitted work reaches the API. Completion releases capacity.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7de1dc"/></marker></defs><rect width="660" height="555" rx="12" fill="#0c1524"/><path d="M 330.0 120 V 135.0 H 330.0 V 150" fill="none" stroke="#7de1dc" stroke-width="2" marker-end="url(#arrow)"/><text x="330.0" y="125.0" text-anchor="middle" fill="#b6a0f4" font-family="Arial,sans-serif" font-size="12">request</text><path d="M 330.0 240 V 265.0 H 160.0 V 290" fill="none" stroke="#7de1dc" stroke-width="2" marker-end="url(#arrow)"/><text x="245.0" y="255.0" text-anchor="middle" fill="#b6a0f4" font-family="Arial,sans-serif" font-size="12">at capacity</text><path d="M 330.0 240 V 265.0 H 500.0 V 290" fill="none" stroke="#7de1dc" stroke-width="2" marker-end="url(#arrow)"/><text x="415.0" y="255.0" text-anchor="middle" fill="#b6a0f4" font-family="Arial,sans-serif" font-size="12">permit granted</text><path d="M 20 335.0 H 8 V 75.0 H 190" fill="none" stroke="#7de1dc" stroke-width="2" marker-end="url(#arrow)"/><path d="M 500.0 380 V 405.0 H 500.0 V 430" fill="none" stroke="#7de1dc" stroke-width="2" marker-end="url(#arrow)"/><text x="500.0" y="395.0" text-anchor="middle" fill="#b6a0f4" font-family="Arial,sans-serif" font-size="12">request finishes</text><path d="M 640 475.0 H 651 V 195.0 H 470" fill="none" stroke="#7de1dc" stroke-width="2" marker-end="url(#arrow)"/><rect x="190" y="30" width="280" height="90" rx="9" fill="#17263a" stroke="#405b70"/><text x="330.0" y="62" text-anchor="middle" fill="#7de1dc" font-family="Arial,sans-serif" font-size="18" font-weight="600">Kafka consumer fleet</text><text x="330.0" y="86" text-anchor="middle" fill="#bbc7d7" font-family="Arial,sans-serif" font-size="14" font-weight="400">Many workers, one API limit</text><rect x="190" y="150" width="280" height="90" rx="9" fill="#17263a" stroke="#405b70"/><text x="330.0" y="182" text-anchor="middle" fill="#7de1dc" font-family="Arial,sans-serif" font-size="18" font-weight="600">Shared permit pool</text><text x="330.0" y="206" text-anchor="middle" fill="#bbc7d7" font-family="Arial,sans-serif" font-size="14" font-weight="400">Redis / Valkey coordination</text><rect x="20" y="290" width="280" height="90" rx="9" fill="#17263a" stroke="#405b70"/><text x="160.0" y="322" text-anchor="middle" fill="#7de1dc" font-family="Arial,sans-serif" font-size="18" font-weight="600">Pause / retry</text><text x="160.0" y="346" text-anchor="middle" fill="#bbc7d7" font-family="Arial,sans-serif" font-size="14" font-weight="400">No permit available</text><rect x="360" y="290" width="280" height="90" rx="9" fill="#17263a" stroke="#405b70"/><text x="500.0" y="322" text-anchor="middle" fill="#7de1dc" font-family="Arial,sans-serif" font-size="18" font-weight="600">Enterprise API</text><text x="500.0" y="346" text-anchor="middle" fill="#bbc7d7" font-family="Arial,sans-serif" font-size="14" font-weight="400">Admitted requests only</text><rect x="360" y="430" width="280" height="90" rx="9" fill="#17263a" stroke="#405b70"/><text x="500.0" y="462" text-anchor="middle" fill="#7de1dc" font-family="Arial,sans-serif" font-size="18" font-weight="600">Complete / release</text><text x="500.0" y="486" text-anchor="middle" fill="#bbc7d7" font-family="Arial,sans-serif" font-size="14" font-weight="400">Return permit capacity</text></svg>