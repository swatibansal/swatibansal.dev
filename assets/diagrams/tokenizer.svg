<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 480" role="img" aria-labelledby="title desc"><title id="title">A tokenizer has a round-trip contract</title><desc id="desc">Unicode-normalized text is segmented and encoded using a learned vocabulary. Decoding is checked against normalized text, with whitespace and metaspace limitations documented.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7de1dc"/></marker></defs><rect width="660" height="480" rx="12" fill="#0c1524"/><path d="M 160.0 120 V 147.5 H 160.0 V 175" fill="none" stroke="#7de1dc" stroke-width="2" marker-end="url(#arrow)"/><text x="160.0" y="137.5" text-anchor="middle" fill="#b6a0f4" font-family="Arial,sans-serif" font-size="12">normalize</text><path d="M 300 220.0 H 360" fill="none" stroke="#7de1dc" stroke-width="2" marker-end="url(#arrow)"/><text x="330.0" y="206.0" text-anchor="middle" fill="#b6a0f4" font-family="Arial,sans-serif" font-size="12">encode</text><path d="M 500.0 120 V 147.5 H 500.0 V 175" fill="none" stroke="#7de1dc" stroke-width="2" marker-end="url(#arrow)"/><text x="500.0" y="137.5" text-anchor="middle" fill="#b6a0f4" font-family="Arial,sans-serif" font-size="12">merge rules</text><path d="M 500.0 265 V 307.5 H 500.0 V 350" fill="none" stroke="#7de1dc" stroke-width="2" marker-end="url(#arrow)"/><text x="500.0" y="297.5" text-anchor="middle" fill="#b6a0f4" font-family="Arial,sans-serif" font-size="12">decode</text><path d="M 360 395.0 H 300" fill="none" stroke="#7de1dc" stroke-width="2" marker-end="url(#arrow)"/><text x="330.0" y="381.0" text-anchor="middle" fill="#b6a0f4" font-family="Arial,sans-serif" font-size="12">validate</text><rect x="20" y="30" width="280" height="90" rx="9" fill="#17263a" stroke="#405b70"/><text x="160.0" y="62" text-anchor="middle" fill="#7de1dc" font-family="Arial,sans-serif" font-size="18" font-weight="600">Text in four languages</text><text x="160.0" y="86" text-anchor="middle" fill="#bbc7d7" font-family="Arial,sans-serif" font-size="14" font-weight="400">English · Hindi · Telugu · Bengali</text><rect x="20" y="175" width="280" height="90" rx="9" fill="#17263a" stroke="#405b70"/><text x="160.0" y="207" text-anchor="middle" fill="#7de1dc" font-family="Arial,sans-serif" font-size="18" font-weight="600">Normalize / segment</text><text x="160.0" y="231" text-anchor="middle" fill="#bbc7d7" font-family="Arial,sans-serif" font-size="14" font-weight="400">NFC + grapheme boundaries</text><rect x="360" y="30" width="280" height="90" rx="9" fill="#17263a" stroke="#405b70"/><text x="500.0" y="62" text-anchor="middle" fill="#7de1dc" font-family="Arial,sans-serif" font-size="18" font-weight="600">Shared vocabulary</text><text x="500.0" y="86" text-anchor="middle" fill="#bbc7d7" font-family="Arial,sans-serif" font-size="14" font-weight="400">Learned BPE merges</text><rect x="360" y="175" width="280" height="90" rx="9" fill="#17263a" stroke="#405b70"/><text x="500.0" y="207" text-anchor="middle" fill="#7de1dc" font-family="Arial,sans-serif" font-size="18" font-weight="600">Encode to token IDs</text><text x="500.0" y="231" text-anchor="middle" fill="#bbc7d7" font-family="Arial,sans-serif" font-size="14" font-weight="400">Merges + byte fallback</text><rect x="20" y="350" width="280" height="90" rx="9" fill="#17263a" stroke="#405b70"/><text x="160.0" y="382" text-anchor="middle" fill="#7de1dc" font-family="Arial,sans-serif" font-size="18" font-weight="600">Compare normalized text</text><text x="160.0" y="406" text-anchor="middle" fill="#bbc7d7" font-family="Arial,sans-serif" font-size="14" font-weight="400">Check documented exceptions</text><rect x="360" y="350" width="280" height="90" rx="9" fill="#17263a" stroke="#405b70"/><text x="500.0" y="382" text-anchor="middle" fill="#7de1dc" font-family="Arial,sans-serif" font-size="18" font-weight="600">Decode token IDs</text><text x="500.0" y="406" text-anchor="middle" fill="#bbc7d7" font-family="Arial,sans-serif" font-size="14" font-weight="400">Reconstruct visible characters</text></svg>